name: Deploy nodejs app in excloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      -
        name: Build and push Docker image
        run: |
          docker build -t vspj10/chaicode-node .
          docker push vspj10/chaicode-node
      - name: Deploy on excloud server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 210.79.128.162
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            # Stop and remove existing container if it exists
            sudo docker stop chaicode-node-container || true
            sudo docker rm chaicode-node-container || true
            # Pull the fresh image from hub
            sudo docker pull vspj10/chaicode-node:latest
            # Run the new container
            sudo docker run -d --name chaicode-node-container -p 80:8000 vspj10/chaicode-node:latest
            # Clean up old/unused images
            sudo docker image prune -f